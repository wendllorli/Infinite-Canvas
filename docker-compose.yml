services:
  app:
    image: infinite-canvas:local
    build:
      context: .
      dockerfile: Dockerfile
    container_name: infinite-canvas
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      - chatgpt-discount
    # 统计分析（可选，默认关闭）。每家一个独立变量，填了谁就启用谁，可同时启用多家：
    # environment:
    #   ANALYTICS_GA4_ID: G-XXXXXXXXXX                    # Google Analytics 4 衡量 ID
    #   ANALYTICS_BAIDU_ID: xxxxxxxxxxxxxxxxxxxxxxxxxxxx   # 百度统计站点 ID

  chatgpt-discount:
    image: ghcr.io/basketikun/chatgpt2api:latest
    restart: unless-stopped
    environment:
      STORAGE_BACKEND: json
      CHATGPT2API_AUTH_KEY: ${CHATGPT2API_AUTH_KEY:?请设置 CHATGPT2API_AUTH_KEY}
    volumes:
      - chatgpt_discount_data:/app/data

volumes:
  chatgpt_discount_data:
